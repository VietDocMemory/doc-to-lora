# Continue training the released Qwen D2L hypernetwork on balanced ViQuAD2.
# The base model and source checkpoint are supplied on the command line.

train_ds_names:
  - viquad2_balanced
val_ds_names:
  - viquad2_balanced

use_kl_loss: false
use_per_ctx_average_loss: true
gen_lora_l1_reg_coef: 0.1
add_negative_prompt: false

max_qas_len: 1024
max_qas_per_sample: 1
max_ctx_chunk_len: 512
min_ctx_chunk_len: 25
max_ctx_chunk_num: 8
max_packed_inp_len: 1024
max_packed_ctx_len: 2048

learning_rate: 0.00001
max_steps: 2000
warmup_steps: 100
gradient_accumulation_steps: 8
gradient_checkpointing: false

eval_strategy: steps
eval_steps: 200
max_val_samples_per_ds: 1000
logging_steps: 10
save_strategy: steps
save_steps: 200
save_total_limit: 10
save_safetensors: false

bf16: true
tf32: true
dataloader_num_workers: 4
